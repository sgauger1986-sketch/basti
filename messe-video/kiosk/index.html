<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MexXsoft Messevideo</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;user-select:none;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #cam{object-fit:cover;transform:scaleX(-1);display:none;background:#1c0b36}
  #cam.on{display:block}
  #mir{position:fixed;inset:0;display:none;pointer-events:none}
  #mir.on{display:block}
  #mir .top{position:absolute;left:4vw;right:4vw;top:5vh;text-align:center;font-size:7.2vw;font-weight:800;line-height:1;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 10px rgba(0,0,0,.9),0 16px 60px rgba(0,0,0,.7);opacity:0;transform:scale(1.6);transition:opacity .35s,transform .45s cubic-bezier(.34,1.56,.64,1)}
  #mir .top.on{opacity:1;transform:scale(1)}
  #mir .top em{font-style:normal;color:#ffb020}
  #mir .bar{position:absolute;left:0;right:0;bottom:0;height:11vh;display:flex;align-items:center;justify-content:center;gap:2vw;background:linear-gradient(0deg,rgba(18,6,38,.92),rgba(18,6,38,.55));border-top:2px solid rgba(255,255,255,.15)}
  #mir .bar .b{padding:1.2vh 2.4vw;border-radius:999px;background:#ffb020;color:#1a0836;font-size:3vw;font-weight:800;animation:pulse 2s ease-in-out infinite}
  #mir .bar .t{font-size:2.2vw;font-weight:600;color:#e9e0ff}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  #mir .frame{position:absolute;inset:2.5vh 2.5vw 11vh;border:6px solid rgba(255,176,32,.9);border-radius:2vw;box-shadow:0 0 0 2vw rgba(28,11,54,.35) inset}
  #burst{position:absolute;left:0;right:0;top:32vh;text-align:center;font-size:13vw;font-weight:800;letter-spacing:-.04em;color:#ffb020;text-shadow:0 6px 14px rgba(0,0,0,.9),0 20px 70px rgba(0,0,0,.8);opacity:0;transform:scale(2.5) rotate(-6deg);transition:opacity .25s,transform .4s cubic-bezier(.34,1.56,.64,1)}
  #burst.on{opacity:1;transform:scale(1) rotate(-4deg)}
  #burst small{display:block;font-size:4vw;color:#fff;letter-spacing:0;margin-top:1vh}
  #logo{position:absolute;right:3.5vw;top:4vh;font-size:2.4vw;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9);letter-spacing:.02em}
  #lock{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,4,22,.82);backdrop-filter:blur(10px);cursor:default}
  #lock.on{display:flex}
  .box{width:min(92vw,420px);padding:34px 30px;border-radius:24px;background:#1c0b36;border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 90px rgba(0,0,0,.6);text-align:center}
  .box h1{font-size:22px;margin:0 0 6px;font-weight:700}
  .box p{margin:0 0 22px;color:#c3b8d8;font-size:15px}
  .dots{display:flex;justify-content:center;gap:16px;margin-bottom:22px;height:22px}
  .dots i{width:18px;height:18px;border-radius:50%;border:2px solid #b48cff;display:block;transition:background .1s}
  .dots i.f{background:#b48cff}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad button{font:inherit;font-size:24px;font-weight:600;padding:16px 0;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;cursor:pointer}
  .pad button:active{background:#b48cff;color:#1a0836}
  .pad button.x{font-size:16px;color:#c3b8d8}
  .msg{height:20px;margin-top:14px;font-size:14px;color:#ff8a8a}
  .box.shake{animation:sh .35s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:#8a7aa6}
</style>
</head>
<body>
<video id="v" autoplay loop muted playsinline disablepictureinpicture></video>
<video id="cam" autoplay muted playsinline></video>
<div id="mir">
  <div class="frame"></div>
  <div id="logo">MEXXSOFT X2</div>
  <div class="top" id="pl"></div>
  <div id="burst"></div>
  <div class="bar"><span class="b">Live-Demo hier am Stand · 5 Minuten</span><span class="t">GaLaBau &amp; Tiefbau · E-Rechnung · inFleet</span></div>
</div>
<canvas id="mc" width="64" height="36" style="display:none"></canvas>

<div id="lock">
  <div class="box" id="box">
    <h1>Video beenden</h1>
    <p>Bitte PIN eingeben</p>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="x" data-k="esc">Zurück</button><button data-k="0">0</button><button class="x" data-k="del">⌫</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="hint">Ohne Eingabe wird die Wiedergabe automatisch fortgesetzt.</div>
</div>

<script>
  const q = new URLSearchParams(location.search);
  const v = document.getElementById('v');
  v.src = q.get('video') || 'video.mp4';
  const SCALE = Math.min(1, Math.max(0.5, parseFloat(q.get('scale')) || 1));   // config.json "scale": 0.9 -> Ränder frei (TV-Overscan)
  if (SCALE < 1) v.style.transform = 'scale(' + SCALE + ')';
  const play = () => v.play().catch(() => setTimeout(play, 500));
  v.addEventListener('canplay', play, { once: true });
  v.addEventListener('ended', () => { if (v.loop) { v.currentTime = 0; play(); } });   // Sicherheitsnetz zusätzlich zu loop
  v.addEventListener('error', () => { document.body.style.cursor = 'default'; document.body.innerHTML = '<div style="padding:40px;font-size:20px">Video nicht gefunden:<br>' + v.src + '</div>'; });
  setInterval(() => { if (v.paused && !lock.classList.contains('on') && !mirrorOn) play(); }, 3000);

  // ---------- Spiegel-Modus (Webcam) im Wechsel mit dem Video ----------
  const MODE = q.get('mode') === 'video' ? 'video' : 'attract';
  const MIRROR_S = Math.min(120, Math.max(5, parseInt(q.get('mirror')) || 25));
  const VIDEO_S = Math.max(0, parseInt(q.get('videosec')) || 0);   // 0 = Video immer komplett, sonst nach x s zurück zum Spiegel (Video läuft später weiter)
  let PUNCH = [];
  try { PUNCH = JSON.parse(q.get('punchlines') || '[]'); } catch {}
  if (!Array.isArray(PUNCH) || !PUNCH.length) PUNCH = [
    'Sie da! <em>Ja, Sie.</em>', 'Noch Excel auf der Baustelle?', 'Rechnungen abends am <em>Küchentisch?</em>',
    'E-Rechnung wird Pflicht. <em>2027.</em>', 'Wo ist Ihr Bagger <em>gerade?</em>', 'Aufmaß rein. <em>Rechnung raus.</em>',
    '<em>5 Minuten.</em> Dann wissen Sie es.', 'Lächeln – Sie sind auf dem <em>Messe-Bildschirm.</em>',
  ];
  const BURSTS = ['HALLO!', 'HEY!', 'MOMENT!', 'JA, SIE!', 'STOPP!'];
  const cam = document.getElementById('cam'), mir = document.getElementById('mir'), pl = document.getElementById('pl'), burst = document.getElementById('burst');
  const mc = document.getElementById('mc'), mctx = mc.getContext('2d', { willReadFrequently: true });
  let mirrorOn = false, camOk = false, plIdx = 0, plTimer = null, phaseTimer = null, prev = null, lastBurst = 0, burstTimer = null;
  const BURST_TEXTS = ['Bleiben Sie kurz stehen.', 'Wir zeigen es Ihnen in 5 Minuten.', 'Live-Demo direkt hier.', 'Eine Frage, eine Antwort.'];
  function nextPunch(){ pl.classList.remove('on'); setTimeout(() => { pl.innerHTML = PUNCH[plIdx++ % PUNCH.length]; pl.classList.add('on'); }, 350); }
  function showBurst(){ const now = Date.now(); if (now - lastBurst < 7000) return; lastBurst = now;
    burst.innerHTML = BURSTS[Math.floor(Math.random()*BURSTS.length)] + '<small>' + BURST_TEXTS[Math.floor(Math.random()*BURST_TEXTS.length)] + '</small>';
    burst.classList.add('on'); clearTimeout(burstTimer); burstTimer = setTimeout(() => burst.classList.remove('on'), 2600); }
  function motion(){ if (!mirrorOn || cam.readyState < 2) return;
    mctx.drawImage(cam, 0, 0, mc.width, mc.height); const d = mctx.getImageData(0, 0, mc.width, mc.height).data;
    if (prev) { let sum = 0; for (let i = 0; i < d.length; i += 4) sum += Math.abs(d[i] - prev[i]) + Math.abs(d[i+1] - prev[i+1]) + Math.abs(d[i+2] - prev[i+2]);
      const avg = sum / (d.length / 4) / 3; if (avg > 14) showBurst(); }
    prev = new Uint8ClampedArray(d); }
  function startMirror(){ mirrorOn = true; v.pause(); v.style.display = 'none'; cam.classList.add('on'); mir.classList.add('on'); prev = null;
    nextPunch(); clearInterval(plTimer); plTimer = setInterval(nextPunch, 4000);
    clearTimeout(phaseTimer); phaseTimer = setTimeout(startVideo, MIRROR_S * 1000); }
  function startVideo(){ mirrorOn = false; clearInterval(plTimer); pl.classList.remove('on'); burst.classList.remove('on');
    cam.classList.remove('on'); mir.classList.remove('on'); v.style.display = ''; v.loop = !camOk; if (!VIDEO_S) v.currentTime = 0; play();
    clearTimeout(phaseTimer); if (VIDEO_S && camOk) phaseTimer = setTimeout(startMirror, VIDEO_S * 1000); }
  v.addEventListener('ended', () => { if (camOk && MODE === 'attract') startMirror(); });
  if (MODE === 'attract' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: 'user' }, audio: false })
      .then(stream => { cam.srcObject = stream; camOk = true; v.loop = false; setInterval(motion, 250); startMirror(); })
      .catch(() => { camOk = false; v.loop = true; });
  }

  const lock = document.getElementById('lock'), dots = document.getElementById('dots'), msg = document.getElementById('msg'), box = document.getElementById('box');
  const TIMEOUT = (parseInt(q.get('timeout')) || 20) * 1000;
  const PINLEN = Math.max(1, parseInt(q.get('pinlen')) || 4);
  let pin = '', timer = null;
  dots.innerHTML = '<i></i>'.repeat(PINLEN);
  const render = () => [...dots.children].forEach((d, i) => d.classList.toggle('f', i < pin.length));
  const arm = () => { clearTimeout(timer); timer = setTimeout(hide, TIMEOUT); };
  function showLock(){ if (lock.classList.contains('on')) return arm(); pin = ''; msg.textContent = ''; render(); lock.classList.add('on'); arm(); }
  function hide(){ clearTimeout(timer); lock.classList.remove('on'); pin = ''; render(); }
  async function push(k){
    arm();
    if (k === 'esc') return hide();
    if (k === 'del') { pin = pin.slice(0, -1); return render(); }
    if (!/^[0-9]$/.test(k) || pin.length >= PINLEN) return;
    pin += k; render();
    if (pin.length === PINLEN) {
      const ok = await window.kiosk.checkPin(pin);
      if (ok) { msg.style.color = '#8cff9a'; msg.textContent = 'PIN korrekt – wird beendet …'; setTimeout(() => window.kiosk.quit(), 150); }
      else fail();
    }
  }
  function fail(){ msg.style.color = '#ff8a8a'; msg.textContent = 'Falsche PIN'; box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 400); pin = ''; render(); }

  document.getElementById('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) push(b.dataset.k); });
  addEventListener('keydown', e => {
    if (!lock.classList.contains('on')) { showLock(); if (/^[0-9]$/.test(e.key)) push(e.key); return; }
    if (e.key === 'Escape') return hide();
    if (e.key === 'Backspace') return push('del');
    if (/^[0-9]$/.test(e.key)) push(e.key);
    e.preventDefault();
  });
  addEventListener('mousedown', e => { if (!lock.classList.contains('on')) showLock(); });
  addEventListener('touchstart', e => { if (!lock.classList.contains('on')) showLock(); }, { passive: true });
  addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
