<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mexXsoft X2 Cloud</title>
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="mexXsoft X2 als Web-App — offline nutzbar, online synchron auf allen Geräten.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="X2 Cloud">
<style>
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eef1ec; --border:#dde2da;
  --ink:#1b1f1a; --ink-2:#59614f; --ink-3:#87907c;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e4efe8;
  --angebot:#b7791f; --angebot-bg:#faf0dc;
  --auftrag:#2f6b4f; --auftrag-bg:#e4efe8;
  --rechnung:#2b5f87; --rechnung-bg:#e2ecf4;
  --muster:#6b6470; --muster-bg:#ecebee;
  --shadow:0 1px 2px rgba(20,30,15,.06),0 2px 8px rgba(20,30,15,.05);
  --radius:9px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13160f; --surface:#1c2018; --surface-2:#232819; --border:#333a29;
  --ink:#e8ece2; --ink-2:#a3ab97; --ink-3:#767e6b;
  --accent:#6bbd8f; --accent-ink:#0e1409; --accent-soft:#1e2b22;
  --angebot:#e0b061; --angebot-bg:#2c2413; --auftrag:#6bbd8f; --auftrag-bg:#16271d;
  --rechnung:#78b1de; --rechnung-bg:#152534; --muster:#b0a8ba; --muster-bg:#242130;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
}}
:root[data-theme="light"]{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eef1ec; --border:#dde2da;
  --ink:#1b1f1a; --ink-2:#59614f; --ink-3:#87907c; --accent:#2f6b4f;
  --accent-ink:#fff; --accent-soft:#e4efe8; --angebot:#b7791f; --angebot-bg:#faf0dc;
  --auftrag:#2f6b4f; --auftrag-bg:#e4efe8; --rechnung:#2b5f87; --rechnung-bg:#e2ecf4;
  --muster:#6b6470; --muster-bg:#ecebee; --shadow:0 1px 2px rgba(20,30,15,.06),0 2px 8px rgba(20,30,15,.05);
}
:root[data-theme="dark"]{
  --bg:#13160f; --surface:#1c2018; --surface-2:#232819; --border:#333a29;
  --ink:#e8ece2; --ink-2:#a3ab97; --ink-3:#767e6b; --accent:#6bbd8f;
  --accent-ink:#0e1409; --accent-soft:#1e2b22; --angebot:#e0b061; --angebot-bg:#2c2413;
  --auftrag:#6bbd8f; --auftrag-bg:#16271d; --rechnung:#78b1de; --rechnung-bg:#152534;
  --muster:#b0a8ba; --muster-bg:#242130; --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:100vh}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.brand .logo{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:12px 12px 5px;font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--ink-2);font:inherit;padding:8px 12px;border-radius:7px;cursor:pointer}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .ic{width:17px;text-align:center;flex:none;opacity:.85}
.nav .badge{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--ink-3)}
/* Main */
.main{overflow-y:auto}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:12px 26px}
.crumb{font-size:13px;color:var(--ink-2);font-weight:500}
.crumb b{color:var(--ink)}
.search{margin-left:auto;position:relative}
.search input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px 7px 30px;font:inherit;color:var(--ink);width:210px}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search::before{content:"⌕";position:absolute;left:10px;top:6px;color:var(--ink-3);font-size:15px}
.theme{background:var(--surface);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}
.theme:hover{color:var(--ink)}
.wrap{padding:26px;max-width:1180px}
h1.page{font-size:21px;letter-spacing:-.02em;margin-bottom:3px;text-wrap:balance}
.sub{color:var(--ink-2);font-size:13px;margin-bottom:22px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.kpi .val{font-size:25px;font-weight:650;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;font-weight:600;color:var(--ink-2)}
.kpi .meta{font-size:12px;color:var(--ink-2);margin-top:4px}
.kpi .bar{margin-top:2px}
/* Cards / tables */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.card > h2{font-size:13px;font-weight:650;padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.card > h2 .cnt{font-size:11.5px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.muted{color:var(--ink-3)}
.strong{font-weight:600}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-angebot{color:var(--angebot);background:var(--angebot-bg)}
.p-auftrag{color:var(--auftrag);background:var(--auftrag-bg)}
.p-rechnung{color:var(--rechnung);background:var(--rechnung-bg)}
.p-muster{color:var(--muster);background:var(--muster-bg)}
/* detail */
.back{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.dgrid .f{background:var(--surface);padding:12px 16px}
.dgrid .f .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:600}
.dgrid .f .v{margin-top:3px;font-size:14px}
/* LV tree */
.lvrow td:first-child{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.lv-h .txt{font-weight:650}
.lv-h0 td{background:var(--surface-2)}
.lv-pos .txt{color:var(--ink)}
.ind{display:inline-block}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);margin-right:7px;font-family:var(--mono)}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
.note{font-size:12px;color:var(--ink-2);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:8px;padding:11px 14px;margin-bottom:20px;display:flex;gap:9px}
.note .ic{color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-2);font:inherit;font-weight:600;padding:9px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:230px;transform:translateX(-100%);transition:transform .2s;z-index:20}.side.open{transform:none}.menu-btn{display:inline-flex!important}}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}

/* --- Web-App-Ergänzungen: Buttons, Modale, Sync-Status --- */
.actions{display:flex;gap:8px;margin-bottom:16px}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#b23b3b;border-color:color-mix(in srgb,#b23b3b 40%,var(--border))}
.btn.small{padding:5px 10px;font-size:12px;box-shadow:none}
/* Sync-Statuspille in der Topbar */
.syncpill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:5px 11px;white-space:nowrap}
.syncpill .dot{width:8px;height:8px;border-radius:50%;flex:none}
.syncpill .dot.ok{background:#3aa46c;box-shadow:0 0 0 3px color-mix(in srgb,#3aa46c 25%,transparent)}
.syncpill .dot.idle{background:#c9a13c}
.syncpill .dot.off{background:#b23b3b}
/* Cloud-Bereich im Seitenmenü */
.cloud{border-top:1px solid var(--border);padding:12px 14px;font-size:12px}
.cloud .cst{font-size:12.5px}
.cloud .cst2{color:var(--ink-3);margin-top:3px;line-height:1.5}
.cloud .cst2.err{color:#b23b3b}
.cloud .cbtns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
/* Modale */
#modal-back[hidden]{display:none}
#modal-back{position:fixed;inset:0;background:rgba(10,14,8,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:100%;max-width:640px;max-height:92vh;overflow:auto}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.mhead h3{font-size:15px}
.mclose{background:none;border:none;color:var(--ink-3);font-size:15px;cursor:pointer;padding:4px}
.mbody{padding:16px 18px}
.mbody .hint{font-size:12px;color:var(--ink-2);background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.5}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fi{display:block;margin-bottom:11px}
.fi span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.fi input:not([type=checkbox]),.fi select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--ink);font:inherit;padding:8px 11px}
.fi input:focus,.fi select:focus{outline:none;border-color:var(--accent)}
.fi.check{display:flex;align-items:center;gap:8px}
.fi.check span{margin:0;text-transform:none;font-size:13px;color:var(--ink);font-weight:500;letter-spacing:0}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;padding-top:12px;border-top:1px solid var(--border)}
/* Toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;border-radius:99px;padding:10px 18px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.show.err{background:#b23b3b;color:#fff}
@media (max-width:820px){.syncpill{font-size:0;gap:0;padding:5px 8px}.syncpill .dot{margin:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">X2</div>
      <div><b>mexXsoft X2</b><span>Cloud · Offline-First</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="cloud" id="cloudstate"></div>
    <div class="foot">Läuft auf jedem Gerät —<br>auch ohne Internetverbindung</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu" aria-label="Menü">☰</button>
      <div class="crumb" id="crumb">Dashboard</div>
      <div class="search"><input id="q" placeholder="Suchen…" aria-label="Suchen"></div>
      <span class="syncpill" id="syncpill"><span class="dot off"></span>…</span>
      <button class="theme" id="theme" aria-label="Design wechseln">◐</button>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>
<div id="modal-back" hidden></div>
<div id="toast"></div>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
